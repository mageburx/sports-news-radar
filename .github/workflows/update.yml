name: Sports News Radar
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sports_radar/**'
      - 'config/**'
      - 'requirements.txt'
      - '.github/workflows/update.yml'
permissions:
  contents: write
concurrency:
  group: sports-radar-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Testar
        run: python -m unittest discover -s tests -v
      - name: Recolher notícias
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          MYMEMORY_EMAIL: ${{ secrets.MYMEMORY_EMAIL }}
        run: python -m sports_radar.collector
      - name: Publicar os dados
        if: always()
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/news.json docs/data/status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: atualizar Sports News Radar'
          git push origin HEAD:main
